[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xoose-builder"
version = "0.1.0"
description = "Python Build Engine for Xoose-LoveYou application generator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Xoose Team" }
]
dependencies = [
    "pyinstaller>=6.0",
]

[project.scripts]
xoose-builder = "xoose_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
